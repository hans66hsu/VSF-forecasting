name: lorenz
kind: probabilistic
file_name: lorenz_${.num_initial_conditions}_${.num_rhos_per_initial_condition}.npz
state_key: states
state_names: [x, y, z]
metrics: [conditional_mean_error, conditional_std_error, wasserstein_w1, energy_distance]
regenerate: False

num_initial_conditions: 40
num_rhos_per_initial_condition: 100
t_max: 30.0
dt: 0.01
seed: 0
rho_values: [23.74, 24.74, 25.74]
initial_noise_std: 0.01
sigma: 10.0
beta: 2.6666666666666665

train_fraction: 0.7
val_fraction: 0.15
obs_horizon: 5
pred_horizon: 20
# rollout_horizon: 1
rollout_horizon: 10
eval_anchor_index: 15
eval_total_future_steps: 1000
