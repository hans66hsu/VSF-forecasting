name: lorenz-deter
kind: deterministic
file_name: lorenz_deter_${.num_initial_conditions}_${.num_rhos_per_initial_condition}.npz
state_key: states
state_names: [x, y, z]
metrics: [rmse, mae, crps]
regenerate: false

num_initial_conditions: 200
num_rhos_per_initial_condition: 1
t_max: 30.0
dt: 0.01
seed: 0
rho_values: [24.74]
initial_noise_std: 0.01
sigma: 10.0
beta: 2.6666666666666665

train_fraction: 0.7
val_fraction: 0.15
obs_horizon: 5
pred_horizon: 20
rollout_horizon: 10
eval_anchor_index: 15
eval_total_future_steps: 1000
