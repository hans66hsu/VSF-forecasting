name: rossler-deter
kind: deterministic
file_name: rossler_deter_${.num_initial_conditions}_${.num_cs_per_initial_condition}.npz
state_key: states
state_names: [x, y, z]
metrics: [rmse, mae, crps]
regenerate: false

num_initial_conditions: 200
num_cs_per_initial_condition: 1
t_max: 30.0
dt: 0.02
seed: 0
c_values: [5.7]
initial_noise_std: 0.01
a: 0.2
b: 0.2

train_fraction: 0.7
val_fraction: 0.15
obs_horizon: 10
pred_horizon: 20
rollout_horizon: 10
eval_anchor_index: 150
eval_total_future_steps: 1000
